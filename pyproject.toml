[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-vqa-explanation"
version = "0.1.0"
description = "Vietnamese VQA with explanations: data checks, SFT training, and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "filelock>=3.16",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers==4.57.6",
  "datasets>=3.0",
  "accelerate>=1.2",
  "peft>=0.14",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
]
demo = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1"]
report = ["matplotlib>=3.9"]
semantic-eval = [
  "torch>=2.4",
  "transformers==4.57.6",
  "bert-score==0.3.13",
]
verification = ["torch>=2.4", "torchvision>=0.19", "transformers==4.57.6",
                "accelerate==1.14.0", "peft==0.20.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vqa_explanation.preference" = ["templates/*.html", "templates/*.css", "templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["historical: checks requiring immutable run artifacts outside source-only checkouts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve the exact executed verification cell and its output in the archived run.
"notebooks/archive/02_sft_smoke.ipynb" = ["I001"]
